<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fudan SafeTest</title>
    <style>
      body {
        box-sizing: border-box;
        width: 320px;
        margin: 0;
        padding: 18px;
        color: #172033;
        background: #f6f8fc;
        font: 14px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 { margin: 0 0 8px; font-size: 19px; }
      p { margin: 8px 0 14px; color: #526079; }
      button {
        width: 100%;
        border: 0;
        border-radius: 9px;
        padding: 11px 14px;
        color: white;
        background: #155eef;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
      button:disabled { cursor: wait; opacity: 0.65; }
      .safe { margin-top: 12px; color: #267a42; font-weight: 650; }
      #status { min-height: 22px; margin: 10px 0 0; color: #526079; }
    </style>
  </head>
  <body>
    <h1>Fudan SafeTest</h1>
    <p>点击后会打开安全考试。完成登录即可自动进入并答题。</p>
    <button id="start" type="button">打开并自动答题</button>
    <div class="safe">不会自动提交试卷</div>
    <div id="status" role="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
